# Das Image wird aus dem Flake gebaut:
#
#   nix build .#dockerImage
#   docker load < result
#   docker compose up -d
#
services:
  memecal:
    image: meme-calendar:latest
    container_name: meme-calendar
    restart: unless-stopped
    # Nur lokal binden - TLS und Auth-Vorschaltung macht der Reverse-Proxy
    # auf zitronas.deutsches.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - memecal-data:/data
    environment:
      MEMECAL_DATA_DIR: /data
      TZ: Europe/Berlin

      # Standard-Enddatum für User ohne eigenes (im Admin-UI überschreibbar).
      # Jeder User kann sein eigenes unter /einstellungen setzen.
      MEMECAL_END_DATE: "2027-03-08"

      # Bundesland für die Feiertagsberechnung.
      MEMECAL_HOLIDAY_SUBDIV: BW

      # Optional: legt beim Start einen festen Admin an. Ohne das wird der
      # erste registrierte Account automatisch Admin (siehe README) - für
      # die meisten Deployments reicht das, ohne .env-Pflege.
      MEMECAL_ADMIN_USERNAME: admin
      MEMECAL_ADMIN_PASSWORD: "${MEMECAL_ADMIN_PASSWORD:-}"

      # Session-Cookies. Leer lassen => wird einmalig in /data generiert.
      MEMECAL_SECRET_KEY: "${MEMECAL_SECRET_KEY:-}"

      # Die kuratierte Kanalliste aus memecal/config.py gilt automatisch,
      # solange diese Zeile auskommentiert bleibt. Zum Überschreiben
      # einkommentieren und in der .env setzen (kommasepariert, Einträge als
      # "kanal" oder "kanal:kategorie") - eine leere Variable würde sonst als
      # "keine Kanäle" verstanden, nicht als "Default verwenden".
      # MEMECAL_DEFAULT_CHANNELS: "${MEMECAL_DEFAULT_CHANNELS}"

      # Videos länger als das landen nicht im Pool.
      MEMECAL_MAX_VIDEO_SECONDS: "90"

    healthcheck:
      test: ["CMD-SHELL", "/bin/sh -c 'exec 3<>/dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  memecal-data:
