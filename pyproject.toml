[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memecal"
version = "0.1.0"
description = "Meme-Kalender: ein deutsches Meme pro Tag"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "sqlalchemy",
    "httpx",
    "argon2-cffi",
    "itsdangerous",
    "pydantic-settings",
    "python-multipart",
]

[project.scripts]
memecal = "memecal.__main__:main"

[tool.setuptools.packages.find]
include = ["memecal*"]

[tool.setuptools.package-data]
memecal = ["templates/*.html", "templates/partials/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "PIE", "RUF"]
ignore = [
    # Depends()/Form() im Default-Argument ist die FastAPI-Idiom, kein Bug.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Die Env-Variablen müssen vor dem ersten memecal-Import stehen.
"tests/conftest.py" = ["E402"]
