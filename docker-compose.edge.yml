# Overlay for the shared box behind zitronas.de:
#   docker compose -f docker-compose.yml -f docker-compose.edge.yml up -d
#
# Hangs memecal into the `edge` network, where the shared Caddy finds it
# under the alias `memecal` and publishes it as memecal.zitronas.de. The
# proxy lives in its own repo (caddy-config) and creates that network, so it
# has to be up first — otherwise: `docker network create edge`.
#
# The published host port goes away with it: the proxy reaches the container
# over the network, and nothing else on that box needs a way in.
services:
  memecal:
    ports: !override []

    # Every app on that box has its own port; this one is 3003. The image's
    # Cmd already hardcodes `--host 0.0.0.0 --port 8000` (see flake.nix), so
    # both get overridden here via `command` rather than MEMECAL_HOST /
    # MEMECAL_PORT — the binary ignores those env vars once explicit CLI
    # args are present.
    command: ["--host", "0.0.0.0", "--port", "3003"]

    healthcheck:
      test: ["CMD-SHELL", "/bin/sh -c 'exec 3<>/dev/tcp/127.0.0.1/3003' || exit 1"]

    networks:
      # No `default` alongside it: this stack is a single container with no
      # neighbours to reach.
      edge:
        aliases:
          - memecal

networks:
  edge:
    external: true
